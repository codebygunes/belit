name: Belit Headless Verification Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Install System Dependencies (LLVM 17, Z3 & GTest)
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake g++ libz3-dev llvm-17-dev libclang-17-dev libgtest-dev libgmock-dev

    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake ..

    - name: Build Belit Engine & Pass Plugins
      run: |
        cd build
        cmake --build . -- -j$(nproc)

    - name: Run SMT Formal Verification Unit Tests
      run: |
        cd build
        ctest --output-on-failure

    - name: Headless Node SecOps Dry-Run (EVM Real-World Bytecode)
      run: |
        echo "" > build/real_evm_payload.hex
        ./build/belit build/real_evm_payload.hex || true
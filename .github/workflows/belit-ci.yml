name: Belit Headless Verification Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Install System Dependencies (LLVM 21 & Z3)
      run: |
        sudo apt-get update
        sudo apt-get install -y llvm-21 llvm-21-dev libz3-dev libgtest-dev cmake build-essential

    - name: Configure CMake
      run: cmake -B build -S .

    - name: Build Belit Engine & Pass Plugins
      run: cmake --build build -j $(nproc)

    - name: Run SMT Formal Verification Tests
      working-directory: ${{github.workspace}}/build
      run: ctest --output-on-failure

    - name: Headless Node SecOps Dry-Run
      run: |
        # Simulate an untrusted FVM Wasm payload verification
        # The node should reject payload if Z3 flags an Out-of-Bounds write
        ./build/belit tests/bytecode_samples/the_dao_reentrancy.hex --skip-opt